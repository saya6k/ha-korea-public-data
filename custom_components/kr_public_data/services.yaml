search_pharmacy:
  fields:
    region:
      required: true
      example: "서울특별시"
      selector:
        text:
    district:
      required: false
      example: "강남구"
      selector:
        text:
    count:
      required: false
      example: "10"
      selector:
        number:
          min: 1
          max: 50
          mode: slider

list_nearby_pharmacies:

get_living_index_forecast:
  fields:
    index_type:
      required: true
      default: "uv"
      selector:
        select:
          translation_key: living_index_type
          options:
            - "uv"
            - "stagnation"
    region:
      required: false
      example: "서울"
      selector:
        select:
          options:
            - "서울"
            - "부산"
            - "대구"
            - "인천"
            - "광주"
            - "대전"
            - "울산"
            - "세종"
            - "경기"
            - "강원"
            - "충북"
            - "충남"
            - "전북"
            - "전남"
            - "경북"
            - "경남"
            - "제주"
